          application/json:
            schema:
              $ref: "#/components/schemas/ISalesEcommCartFulfillmentInput"
    delete:
      operationId: deleteSalesEcommCheckoutEmbeddedRemoveFulfillment
      tags:
        - salesEcommCheckoutEmbedded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISalesEcommCartResponse"
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: x-zs-cart-key
          in: header
          required: true
          schema:
            type: string
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
  /embedded/sales/ecomm/carts/{cartId}/discount-code:
    post:
      operationId: postSalesEcommCheckoutEmbeddedApplyDiscountCode
      tags:
        - salesEcommCheckoutEmbedded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISalesEcommCartResponse"
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: x-zs-cart-key
          in: header
          required: true
          schema:
            type: string
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ISalesEcommCartDiscountCodeInput"
    delete:
      operationId: deleteSalesEcommCheckoutEmbeddedRemoveDiscountCode
      tags:
        - salesEcommCheckoutEmbedded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISalesEcommCartResponse"
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: x-zs-cart-key
          in: header
          required: true
          schema:
            type: string
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
  /embedded/sales/ecomm/carts/{cartId}/payments/setup-cc:
    post:
      operationId: postSalesEcommCheckoutEmbeddedSetupCardPayment
      tags:
        - salesEcommCheckoutEmbedded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISalesEcommCartPaymentSetupResponse"
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: x-zs-cart-key
          in: header
          required: true
          schema:
            type: string
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ISalesEcommCartPaymentSetupInput"
  /embedded/sales/ecomm/carts/{cartId}/payments/{attemptId}:
    get:
      operationId: getSalesEcommCheckoutEmbeddedGetPaymentAttempt
      tags:
        - salesEcommCheckoutEmbedded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISalesEcommPaymentAttemptResponse"
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
        - name: x-zs-cart-key
          in: header
          required: true
          schema:
            type: string
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
    delete:
      operationId: deleteSalesEcommCheckoutEmbeddedCancelPaymentAttempt
      tags:
        - salesEcommCheckoutEmbedded
      responses:
        "200":
          description: OK
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
        - name: x-zs-cart-key
          in: header
          required: true
          schema:
            type: string
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
  /embedded/sales/ecomm/carts/{cartId}/payments/confirm-payment-intent:
    post:
      operationId: postSalesEcommCheckoutEmbeddedConfirmCardPayment
      tags:
        - salesEcommCheckoutEmbedded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISalesEcommOrderResponse"
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: x-zs-cart-key
          in: header
          required: true
          schema:
            type: string
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ISalesEcommCartConfirmPaymentInput"
  /embedded/sales/ecomm/carts/{cartId}/finalize:
    post:
      operationId: postSalesEcommCheckoutEmbeddedFinalizeZeroDueCart
      tags:
        - salesEcommCheckoutEmbedded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISalesEcommCartResponse"
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: x-zs-cart-key
          in: header
          required: true
          schema:
            type: string
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
  /embedded/sales/ecomm/orders/{orderId}:
    get:
      operationId: getSalesEcommOrdersEmbeddedGet
      tags:
        - salesEcommOrdersEmbedded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISalesEcommOrderResponse"
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: x-zs-order-key
          in: header
          required: true
          schema:
            type: string
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
  /embedded/sales/ecomm/config:
    get:
      operationId: getSalesEcommStorefrontConfigEmbeddedGet
      tags:
        - salesEcommStorefrontConfigEmbedded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISalesEcommStorefrontConfigResponse"
      parameters:
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
  /embedded/sales/ecomm/products:
    get:
      operationId: getSalesEcommProductsEmbeddedIndex
      tags:
        - salesEcommProductsEmbedded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ISalesEcommStoreProduct"
      parameters:
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
  /embedded/sales/ecomm/products/{slug}:
    get:
      operationId: getSalesEcommProductsEmbeddedShow
      tags:
        - salesEcommProductsEmbedded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISalesEcommStoreProduct"
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
components:
  schemas:
    IValidateDiscountCodeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        name:
          type: string
        type:
          enum:
            - flat
            - percentage
            - override
            - null
          type:
            - string
            - "null"
        amount:
          type:
            - number
            - "null"
          minimum: 0
        scope:
          $ref: "#/components/schemas/SalesPredefinedDiscountScope"
        itemQtyToDiscount:
          type:
            - number
            - "null"
        itemRepeatable:
          type: boolean
      required:
        - id
        - name
        - scope
        - itemQtyToDiscount
        - itemRepeatable
    IValidateDiscountCodeRequest:
      type: object
      properties:
        code:
          type: string
        tabId:
          type: string
      required:
        - code
        - tabId
    ISalesEcommCartResponse:
      type: object
      properties:
        cartId:
          type: string
        cartKey:
          type: string
        orderKey:
          type: string
        cart:
          $ref: "#/components/schemas/ISalesEcommPublicCart"
      required:
        - cartId
        - cart
    ISalesEcommCartCreateInput:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ISalesEcommCartItemInput"
      required:
        - items
    ISalesEcommCartUpdateItemsInput:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ISalesEcommCartItemInput"
      required:
        - items
    ISalesEcommBuyerInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type:
            - string
            - "null"
      required:
        - name
        - email
    ISalesFulfillmentAddressVerificationResponse:
      oneOf:
        - type: object
          properties:
            valid:
              type: boolean
              enum:
                - false
            issues:
              type: array
              items:
                type: string
          required:
            - valid
            - issues
        - type: object
          properties:
            valid:
              type: boolean
              enum:
                - true
            address:
              $ref: "#/components/schemas/ISalesFulfillmentVerifiedAddress"
          required:
            - valid
            - address
    ISalesEcommAddressVerificationInput:
      type: object
      properties:
        address:
          $ref: "#/components/schemas/ISalesFullfillmentAddress"
      required:
        - address
    ISalesEcommShippingRatesResponse:
      oneOf:
        - $ref: "#/components/schemas/ISalesEcommPublicShippingPlan"
        - type: object
          properties:
            notApplicable:
              type: boolean
              enum:
                - true
          required:
            - notApplicable
    ISalesEcommCartShippingRatesInput:
      type: object
      properties:
        existingId:
          type: string
        locationId:
          type: string
        address:
          oneOf:
            - $ref: "#/components/schemas/ISalesFulfillmentShippingCalculateRequestAddressDet\
                ail"
            - type: object
              properties:
                verificationId:
                  type: string
                country:
                  type: string
              required:
                - verificationId
    ISalesEcommShippingSelectionQuoteResponse:
      type: object
      properties:
        shippingPlanId:
          type: string
        packageRates:
          type: array
          items:
            type: object
            properties:
              carrier:
                type: string
              service:
                type: string
              deliveryDays:
                type:
                  - number
                  - "null"
              rateId:
                type: string
              packageId:
                type: string
            required:
              - carrier
              - service
              - deliveryDays
              - rateId
              - packageId
        shippingPrice:
          type: number
      required:
        - shippingPlanId
        - packageRates
        - shippingPrice
    ISalesEcommShippingSelectionQuoteInput:
      type: object
      properties:
        shippingPlanId:
          type: string
        packageRates:
          type: array
          items:
            type: object
            properties:
              packageId:
                type: string
              rateId:
                type: string
            required:
              - packageId
              - rateId
      required:
        - shippingPlanId
        - packageRates
    ISalesEcommCartFulfillmentInput:
      type: object
      properties:
        recipient:
          $ref: "#/components/schemas/SalesFulfillmentOrderRecipient"
        shippingPlanId:
          type:
            - string
            - "null"
        packageRates:
          type: array
          items:
            type: object
            properties:
              packageId:
                type: string
              rateId:
                type: string
            required:
              - packageId
              - rateId
        notes:
          type:
            - string
            - "null"
      required:
        - recipient
    ISalesEcommCartDiscountCodeInput:
      type: object
      properties:
        code:
          type: string
      required:
        - code
    ISalesEcommCartPaymentSetupResponse:
      type: object
      properties:
        cartId:
          type: string
        cartKey:
          type: string
        orderKey:
          type: string
        cart:
          $ref: "#/components/schemas/ISalesEcommPublicCart"
        paymentAttemptId:
          type: string
        paymentIntentId:
          type: string
        clientSecret:
          type: string
        amount:
          type: number
      required:
        - cartId
        - cart
        - paymentAttemptId
        - paymentIntentId
        - clientSecret
        - amount
    ISalesEcommCartPaymentSetupInput:
      type: object
      properties:
        idempotencyKey:
          type: string
      required:
        - idempotencyKey
    ISalesEcommPaymentAttemptResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^(?:urn:uuid:)?[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        amount:
          type: number
          minimum: 0
        status:
          $ref: "#/components/schemas/SalesEcommPaymentAttemptStatus"
        failureCode:
          type:
            - string
            - "null"
        updatedAt:
          type: string
          format: date-time
        paymentIntentId:
          type:
            - string
            - "null"
      required:
        - id
        - amount
        - status
        - failureCode
        - updatedAt
        - paymentIntentId
    ISalesEcommOrderResponse:
      type: object
      properties:
        id:
          type: string
        saleNumber:
          type: string
        status:
          enum:
            - open
            - payment_pending
            - paid
            - voided
          type: string
        buyer:
          type:
            - object
            - "null"
          properties:
            name:
              type: string
            email:
              type: string
            phone:
              type:
                - string
                - "null"
          required:
            - name
            - email
        items:
          type: array
          items:
            $ref: "#/components/schemas/ISalesEcommOrderItem"
        fulfillment:
          type: object
          properties:
            status:
              enum:
                - pending
                - processing
                - shipped
                - delivered
                - exception
                - canceled
                - null
              type:
                - string
                - "null"
            recipient:
              $ref: "#/components/schemas/SalesFulfillmentOrderRecipient"
            shippingPrice:
              type:
                - number
                - "null"
          required:
            - status
            - recipient
            - shippingPrice
        priceDiscounted:
          type: number
        priceBase:
          type: number
        priceTax:
          type: number
        priceTotal:
          type: number
        pricePaid:
          type: number
        priceDue:
          type: number
        taxes:
          type: array
          items:
            $ref: "#/components/schemas/ISalesTabTaxLine"
        payment:
          type: object
          properties:
            status:
              enum:
                - pending
                - authorized
                - captured
                - failed
                - canceled
              type: string
            brand:
              type:
                - string
                - "null"
            last4:
              type:
                - string
                - "null"
          required:
            - status
        createdAt:
          type: string
          format: date-time
        closedAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - saleNumber
        - status
        - buyer
        - items
        - priceDiscounted
        - priceBase
        - priceTax
        - priceTotal
        - pricePaid
        - priceDue
        - taxes
        - createdAt
        - closedAt
    ISalesEcommCartConfirmPaymentInput:
      type: object
      properties:
        paymentAttemptId:
          type: string
        paymentIntentId:
          type: string
      required:
        - paymentAttemptId
        - paymentIntentId
    ISalesEcommStorefrontConfigResponse:
      type: object
      properties:
        tenantId:
          type: string
        currency:
          type: string
          enum:
            - usd
        payments:
          type: object
          properties:
