openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: "@zyno-platform/sales-api-server"
  version: 0.0.0
paths:
  /embedded/sales/ecomm/discount-codes/validate:
    post:
      operationId: postSalesDiscountCodesEmbeddedValidate
      tags:
        - salesDiscountCodesEmbedded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IValidateDiscountCodeResponse"
      parameters:
        - name: x-zs-cart-key
          in: header
          required: true
          schema:
            type: string
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IValidateDiscountCodeRequest"
  /embedded/sales/ecomm/carts:
    post:
      operationId: postSalesEcommCheckoutEmbeddedCreateCart
      tags:
