        - name: x-zs-cart-key
          in: header
          required: true
          schema:
            type: string
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ISalesEcommBuyerInput"
  /embedded/sales/ecomm/carts/{cartId}/address/verify:
    post:
      operationId: postSalesEcommCheckoutEmbeddedVerifyAddress
      tags:
        - salesEcommCheckoutEmbedded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISalesFulfillmentAddressVerificationResponse"
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: x-zs-cart-key
          in: header
          required: true
          schema:
            type: string
        - name: x-zs-publishable-key
          in: header
