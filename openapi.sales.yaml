          required: true
          schema:
            type: string
        - name: x-zs-cart-key
          in: header
          required: true
          schema:
            type: string
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
    delete:
      operationId: deleteSalesEcommCheckoutEmbeddedAbandonCart
      tags:
        - salesEcommCheckoutEmbedded
      responses:
        "200":
          description: OK
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: x-zs-cart-key
          in: header
          required: true
          schema:
            type: string
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
  /embedded/sales/ecomm/carts/{cartId}/items:
    put:
      operationId: putSalesEcommCheckoutEmbeddedReplaceItems
      tags:
        - salesEcommCheckoutEmbedded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISalesEcommCartResponse"
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: x-zs-cart-key
          in: header
          required: true
          schema:
            type: string
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ISalesEcommCartUpdateItemsInput"
  /embedded/sales/ecomm/carts/{cartId}/buyer:
    put:
      operationId: putSalesEcommCheckoutEmbeddedUpdateBuyer
      tags:
        - salesEcommCheckoutEmbedded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISalesEcommCartResponse"
      parameters:
        - name: cartId
          in: path
