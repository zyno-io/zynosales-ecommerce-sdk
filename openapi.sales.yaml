  /embedded/sales/ecomm/carts/{cartId}/shipping/rates:
    post:
      operationId: postSalesEcommCheckoutEmbeddedCalculateShippingRates
      tags:
        - salesEcommCheckoutEmbedded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISalesEcommShippingRatesResponse"
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: x-zs-cart-key
          in: header
          required: true
          schema:
            type: string
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ISalesEcommCartShippingRatesInput"
  /embedded/sales/ecomm/carts/{cartId}/shipping/selection-quote:
    post:
      operationId: postSalesEcommCheckoutEmbeddedQuoteShippingSelection
      tags:
        - salesEcommCheckoutEmbedded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISalesEcommShippingSelectionQuoteResponse"
      parameters:
        - name: cartId
          in: path
          required: true
          schema:
            type: string
        - name: x-zs-cart-key
          in: header
          required: true
          schema:
            type: string
        - name: x-zs-publishable-key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ISalesEcommShippingSelectionQuoteInput"
  /embedded/sales/ecomm/carts/{cartId}/fulfillment:
    put:
      operationId: putSalesEcommCheckoutEmbeddedUpdateFulfillment
      tags:
        - salesEcommCheckoutEmbedded
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISalesEcommCartResponse"
      parameters:
        - name: cartId
