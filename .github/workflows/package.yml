name: Package and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate
        run: yarn check

      - name: Verify generated documentation
        run: git diff --exit-code

      - name: Build
        run: yarn build

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v${PACKAGE_VERSION}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v${PACKAGE_VERSION}." >&2
            exit 1
          fi

      - name: Create package archive
        run: |
          mkdir package
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          yarn pack --out "package/zyno-io-zynosales-ecommerce-sdk-${PACKAGE_VERSION}.tgz"

      - name: Upload package archive
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ github.sha }}
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download package archive
        uses: actions/download-artifact@v4
        with:
          name: npm-package-${{ github.sha }}
          path: package

      - name: Create GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./package/*.tgz --verify-tag --generate-notes
