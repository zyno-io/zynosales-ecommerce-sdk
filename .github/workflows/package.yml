name: Package and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate
        run: yarn check

      - name: Verify generated documentation
        run: git diff --exit-code

      - name: Build
        run: yarn build

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v${PACKAGE_VERSION}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v${PACKAGE_VERSION}." >&2
            exit 1
          fi

      - name: Create package archive
        run: |
          mkdir package
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          yarn pack --out "package/zyno-io-zynosales-ecommerce-sdk-${PACKAGE_VERSION}.tgz"

      - name: Upload package archive
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ github.sha }}
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Download package archive
        uses: actions/download-artifact@v4
        with:
          name: npm-package-${{ github.sha }}
          path: package

      - name: Publish package to npm
        shell: bash
        run: |
          PACKAGE_ARCHIVE="$(find ./package -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          PACKAGE_NAME="$(tar -xOf "$PACKAGE_ARCHIVE" package/package.json | node --input-type=module --eval "let input = ''; for await (const chunk of process.stdin) input += chunk; process.stdout.write(JSON.parse(input).name)")"
          PACKAGE_VERSION="$(tar -xOf "$PACKAGE_ARCHIVE" package/package.json | node --input-type=module --eval "let input = ''; for await (const chunk of process.stdin) input += chunk; process.stdout.write(JSON.parse(input).version)")"
          PACKAGE_SPEC="${PACKAGE_NAME}@${PACKAGE_VERSION}"

          if npm view "$PACKAGE_SPEC" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "$PACKAGE_SPEC is already published."
          else
            npm publish "$PACKAGE_ARCHIVE" --access public
          fi

      - name: Create GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./package/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./package/*.tgz --verify-tag --generate-notes
          fi
